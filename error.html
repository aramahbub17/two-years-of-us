<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Try Again ♡</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           FIXED SCREEN
        ========================== */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            position: fixed;
            inset: 0;

            overscroll-behavior: none;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;

            color: #65324a;

            background:

                radial-gradient(
                    circle at 50% 35%,
                    #ffffff 0%,
                    #fff8fb 28%,
                    #ffeaf2 58%,
                    #ffd3e3 82%,
                    #f4b0cb 100%
                );

            opacity: 0;

            animation:
                pageIn
                1s
                ease
                forwards;

            touch-action: none;

            -webkit-user-select: none;
            user-select: none;
        }


        /* =========================
           SOFT GLOW
        ========================== */

        .glow {

            position: fixed;

            width: 330px;
            height: 330px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background: #ffb8d2;

            filter: blur(95px);

            opacity: .25;

            pointer-events: none;

            animation:
                glow
                4s
                ease-in-out
                infinite;
        }


        .glow-top {

            position: fixed;

            width: 180px;
            height: 180px;

            top: -70px;
            right: -50px;

            border-radius: 50%;

            background: #ffffff;

            filter: blur(65px);

            opacity: .8;
        }


        /* =========================
           FLOATING PETALS
        ========================== */

        .petal {

            position: fixed;

            width: 6px;
            height: 10px;

            border-radius:
                100% 0 100% 0;

            background:
                rgba(255,255,255,.85);

            opacity: 0;

            pointer-events: none;

            animation:
                fall
                linear
                infinite;
        }


        .p1 {
            left: 12%;
            animation-duration: 8s;
        }

        .p2 {
            left: 30%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .p3 {
            left: 72%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .p4 {
            left: 90%;
            animation-duration: 11s;
            animation-delay: 3s;
        }


        /* =========================
           CARD
        ========================== */

        .card {

            position: relative;

            z-index: 5;

            width: min(86vw, 350px);

            padding: 44px 25px 38px;

            text-align: center;

            border-radius: 30px;

            background:
                rgba(255,255,255,.45);

            border:
                1px solid
                rgba(255,255,255,.9);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 25px 70px
                rgba(150,60,100,.13),

                inset
                0 1px 0
                rgba(255,255,255,.95);

            opacity: 0;

            transform:
                translateY(25px)
                scale(.95);

            animation:
                cardIn
                1s
                cubic-bezier(.2,.8,.2,1)
                .15s
                forwards;
        }


        /* =========================
           CUSTOM STICKER
        ========================== */

        .sticker {

            position: relative;

            width: 92px;
            height: 92px;

            margin:
                0 auto 25px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #ffe1ed
                );

            border:
                2px solid
                rgba(255,255,255,.95);

            box-shadow:

                0 14px 35px
                rgba(190,70,120,.15),

                inset
                0 1px 0
                rgba(255,255,255,1);

            transform:
                rotate(-4deg);

            animation:
                stickerFloat
                2.8s
                ease-in-out
                infinite;
        }


        /* Sticker heart */

        .sticker-heart {

            position: relative;

            width: 35px;
            height: 35px;

            transform:
                rotate(-45deg);

            background:
                linear-gradient(
                    135deg,
                    #e78bab,
                    #c85d89
                );

            border-radius:
                7px 0 7px 7px;

            box-shadow:
                0 7px 15px
                rgba(195,70,120,.22);
        }


        .sticker-heart::before,
        .sticker-heart::after {

            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            background:
                linear-gradient(
                    135deg,
                    #e78bab,
                    #c85d89
                );

            border-radius: 50%;
        }


        .sticker-heart::before {

            top: -17px;
            left: 0;
        }


        .sticker-heart::after {

            top: 0;
            left: 17px;
        }


        /* Tiny shine */

        .shine {

            position: absolute;

            width: 8px;
            height: 8px;

            top: 22px;
            left: 27px;

            border-radius: 50%;

            background: white;

            opacity: .75;

            z-index: 3;
        }


        /* =========================
           TEXT
        ========================== */

        .tiny {

            font-family: Arial, sans-serif;

            font-size: 8px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                rgba(100,45,70,.42);

            margin-bottom: 12px;
        }


        h1 {

            font-size:
                clamp(25px, 7vw, 29px);

            font-weight: 400;

            line-height: 1.2;

            color: #642f49;

            margin-bottom: 12px;
        }


        p {

            font-family: Arial, sans-serif;

            font-size: 11px;

            color:
                rgba(100,45,70,.55);

            letter-spacing: .2px;
        }


        /* =========================
           BOTTOM LINE
        ========================== */

        .line {

            width: 35px;

            height: 1px;

            margin:
                22px auto 17px;

            background:
                rgba(170,80,120,.3);
        }


        .return {

            font-family: Arial, sans-serif;

            font-size: 7px;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            color:
                rgba(100,45,70,.32);

            animation:
                blink
                2s
                ease-in-out
                infinite;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes pageIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        @keyframes cardIn {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(.95);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes stickerFloat {

            0%,100% {

                transform:
                    rotate(-4deg)
                    translateY(0);
            }

            50% {

                transform:
                    rotate(4deg)
                    translateY(-6px);
            }
        }


        @keyframes glow {

            0%,100% {
                transform:
                    translate(-50%, -50%)
                    scale(.9);
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }


        @keyframes blink {

            0%,100% {
                opacity: .3;
            }

            50% {
                opacity: .7;
            }
        }


        @keyframes fall {

            0% {

                top: -20px;

                transform:
                    translateX(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: .7;
            }

            50% {

                transform:
                    translateX(30px)
                    rotate(180deg);

                opacity: .45;
            }

            100% {

                top: 110vh;

                transform:
                    translateX(-20px)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           SMALL PHONES
        ========================== */

        @media(max-width: 380px) {

            .card {

                padding:
                    38px 22px 32px;

                border-radius: 27px;
            }


            .sticker {

                width: 82px;
                height: 82px;

                margin-bottom: 22px;
            }


            .sticker-heart,
            .sticker-heart::before,
            .sticker-heart::after {

                width: 32px;
                height: 32px;
            }


            .sticker-heart::before {
                top: -15px;
            }


            .sticker-heart::after {
                left: 15px;
            }


            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="glow"></div>

    <div class="glow-top"></div>


    <!-- Floating petals -->

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>


    <!-- ERROR CARD -->

    <div class="card">


        <!-- Custom sticker -->

        <div class="sticker">

            <div class="shine"></div>

            <div class="sticker-heart"></div>

        </div>


        <div class="tiny">
            Oops
        </div>


        <h1>
            Try again ♡
        </h1>


        <p>
            That wasn't the secret.
        </p>


        <div class="line"></div>


        <div class="return">
            Going back...
        </div>


    </div>


    <!-- AUTO RETURN -->

    <script>

        setTimeout(() => {

            document.body.style.transition =
                "opacity 1s ease";

            document.body.style.opacity =
                "0";

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);

        }, 3500);

    </script>


</body>

</html>
