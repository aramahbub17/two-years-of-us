<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops 💔</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #32111f,
                    #10060c 60%,
                    #050306
                );

            color: white;
            font-family: Arial, sans-serif;
        }

        .error {
            text-align: center;

            animation: appear 0.8s ease forwards;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 25px;

            animation: heartbeat 1.4s ease-in-out infinite;
        }

        h1 {
            font-size: 25px;
            font-weight: 400;
            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        p {
            color: rgba(255,255,255,.6);
            font-size: 13px;
            letter-spacing: 1px;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

<body>

    <div class="error">

        <div class="heart">💔</div>

        <h1>Oops... Wrong PIN</h1>

        <p>Try again, Pakhiii </p>

    </div>

    <script>

        setTimeout(() => {

            window.location.href = "index.html";

        }, 3500);

    </script>

</body>
</html>
