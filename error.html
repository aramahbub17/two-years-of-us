<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Try Again</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   FIXED SCREEN
========================= */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    position: fixed;
    inset: 0;

    overscroll-behavior: none;
}


body {

    display: flex;

    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;

    color: #642d45;

    background:

    radial-gradient(
        circle at 50% 35%,
        #fffafa 0%,
        #ffedf3 22%,
        #ffd9e5 48%,
        #f5aec5 73%,
        #e887a7 100%
    );

    opacity: 0;

    animation:
        pageAppear
        1s
        ease
        forwards;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================
   SOFT RED / PINK GLOW
========================= */

.glow {

    position: fixed;

    width: 440px;
    height: 440px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #e96f95;

    filter: blur(115px);

    opacity: .24;

    pointer-events: none;

    animation:
        glowPulse
        5s
        ease-in-out
        infinite;
}


.glow-top {

    position: fixed;

    width: 230px;
    height: 230px;

    top: -100px;
    right: -70px;

    border-radius: 50%;

    background: #ffffff;

    filter: blur(75px);

    opacity: .75;

    pointer-events: none;
}


/* =========================
   LIGHT PARTICLES
========================= */

.particle {

    position: fixed;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: rgba(255,255,255,.95);

    box-shadow:
        0 0 12px
        rgba(255,255,255,.9);

    opacity: 0;

    pointer-events: none;

    animation:
        particleFloat
        linear
        infinite;
}


.p1 {

    left: 12%;
    top: 25%;

    animation-duration: 7s;
}


.p2 {

    left: 82%;
    top: 30%;

    animation-duration: 9s;
    animation-delay: 2s;
}


.p3 {

    left: 23%;
    top: 75%;

    animation-duration: 8s;
    animation-delay: 1s;
}


.p4 {

    left: 76%;
    top: 78%;

    animation-duration: 10s;
    animation-delay: 3s;
}


/* =========================
   GLASS CARD
========================= */

.card {

    position: relative;

    z-index: 10;

    width: min(87vw, 360px);

    padding:
        36px 25px 34px;

    text-align: center;

    border-radius: 34px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.72),
            rgba(255,230,239,.45)
        );

    border:
        1px solid
        rgba(255,255,255,.96);

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    box-shadow:

        0 30px 90px
        rgba(150,45,85,.20),

        0 5px 25px
        rgba(210,70,115,.10),

        inset
        0 1px 0
        rgba(255,255,255,1);

    opacity: 0;

    transform:
        translateY(25px)
        scale(.94);

    animation:
        cardReveal
        1.05s
        cubic-bezier(.2,.8,.2,1)
        .1s
        forwards;
}


/* =========================
   CAT STICKER
========================= */

.sticker {

    display: block;

    width: 185px;
    height: auto;

    margin:
        0 auto 16px;

    object-fit: contain;

    filter:

        drop-shadow(
            0 12px 18px
            rgba(160,50,85,.16)
        );

    animation:
        stickerFloat
        3s
        ease-in-out
        infinite;
}


/* =========================
   SMALL LABEL
========================= */

.label {

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 4px;

    text-transform: uppercase;

    color:
        rgba(100,45,70,.40);

    margin-bottom: 11px;
}


/* =========================
   TITLE
========================= */

h1 {

    font-size:
        clamp(27px, 7vw, 32px);

    font-weight: 400;

    line-height: 1.15;

    color: #642d45;

    margin-bottom: 10px;
}


/* =========================
   MESSAGE
========================= */

.message {

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: .2px;

    color:
        rgba(100,45,70,.55);
}


/* =========================
   RETURN
========================= */

.return {

    margin-top: 22px;

    font-family: Arial, sans-serif;

    font-size: 7px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color:
        rgba(100,45,70,.32);

    animation:
        breathe
        2s
        ease-in-out
        infinite;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes pageAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


@keyframes cardReveal {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(.94);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes stickerFloat {

    0%,100% {

        transform:
            translateY(0)
            rotate(-2deg);
    }

    50% {

        transform:
            translateY(-7px)
            rotate(2deg);
    }
}


@keyframes glowPulse {

    0%,100% {

        transform:
            translate(-50%, -50%)
            scale(.88);

        opacity: .18;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: .30;
    }
}


@keyframes particleFloat {

    0% {

        transform:
            translateY(25px)
            scale(.5);

        opacity: 0;
    }

    20% {
        opacity: .7;
    }

    50% {

        transform:
            translateY(-30px)
            scale(1);

        opacity: .45;
    }

    100% {

        transform:
            translateY(-80px)
            scale(.4);

        opacity: 0;
    }
}


@keyframes breathe {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: .65;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px) {

    .card {

        width: 88vw;

        padding:
            31px 20px 30px;

        border-radius: 29px;
    }


    .sticker {

        width: 165px;

        margin-bottom: 13px;
    }


    h1 {

        font-size: 25px;
    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="glow"></div>

<div class="glow-top"></div>


<!-- =========================
     PARTICLES
========================= -->

<div class="particle p1"></div>

<div class="particle p2"></div>

<div class="particle p3"></div>

<div class="particle p4"></div>


<!-- =========================
     ERROR CARD
========================= -->

<div class="card">


    <!-- YOUR CAT PNG -->

    <img
        class="sticker"
        src="cute-cats-sticker.png"
        alt="Cute cats"
    >


    <div class="label">
        A little secret
    </div>


    <h1>
        Not quite...
    </h1>


    <div class="message">
        Try again, Pakhiii.
    </div>


    <div class="return">
        Returning to the lock
    </div>


</div>


<!-- =========================
     AUTO RETURN
========================= -->

<script>

setTimeout(() => {

    document.body.style.transition =
        "opacity 1s ease";

    document.body.style.opacity =
        "0";


    setTimeout(() => {

        window.location.href =
            "lock.html";

    }, 1000);

}, 3500);

</script>


</body>

</html>
