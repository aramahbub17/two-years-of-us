<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 🌸</title>

    <style>

        /* =========================
           GLOBAL / SMOOTH SCROLL
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;

            background:
                radial-gradient(
                    circle at 70% 40%,
                    #35152b 0%,
                    #160914 45%,
                    #050306 100%
                );

            color: white;
            font-family: Georgia, serif;

            -webkit-overflow-scrolling: touch;
        }

        /* =========================
           MAIN SCENE
        ========================== */

        .scene {
            position: relative;

            width: 100%;
            min-height: 100vh;

            overflow: hidden;
        }

        /* =========================
           MOON GLOW
        ========================== */

        .moon {
            position: absolute;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            right: 8%;
            top: 8%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,230,242,.16),
                    rgba(255,230,242,0) 70%
                );

            filter: blur(8px);

            pointer-events: none;
        }

        /* =========================
           STARS
        ========================== */

        .star {
            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: rgba(255,255,255,.75);

            animation:
                twinkle 2s ease-in-out infinite;

            pointer-events: none;
        }

        .s1 {
            left: 12%;
            top: 18%;
        }

        .s2 {
            left: 42%;
            top: 12%;

            animation-delay: .5s;
        }

        .s3 {
            right: 22%;
            top: 20%;

            animation-delay: 1s;
        }

        .s4 {
            right: 10%;
            top: 45%;

            animation-delay: 1.5s;
        }

        .s5 {
            left: 55%;
            top: 28%;

            animation-delay: .8s;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            position: absolute;

            left: 9%;
            top: 50%;

            transform:
                translateY(-50%)
                translateX(-35px);

            width: 370px;

            z-index: 10;

            opacity: 0;

            animation:
                messageIn 1.5s ease 3s forwards;
        }

        .eyebrow {
            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: rgba(255,210,230,.55);

            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px, 6vw, 75px);

            font-weight: 400;

            line-height: .95;

            margin-bottom: 25px;

            background:
                linear-gradient(
                    120deg,
                    #fff,
                    #efbdd4
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .line {
            width: 55px;
            height: 1px;

            background:
                rgba(255,200,220,.5);

            margin-bottom: 22px;
        }

        .message p {
            font-size: 15px;

            line-height: 1.8;

            color:
                rgba(255,230,240,.72);

            max-width: 330px;
        }

        /* =========================
           LILY GARDEN
        ========================== */

        .garden {
            position: absolute;

            right: 5%;
            bottom: 0;

            width: 62%;
            height: 88%;

            z-index: 5;
        }

        /* =========================
           GROUND
        ========================== */

        .ground {
            position: absolute;

            bottom: -40px;
            left: 0;

            width: 100%;
            height: 120px;

            background:
                radial-gradient(
                    ellipse,
                    rgba(80,35,60,.6),
                    transparent 70%
                );

            filter: blur(12px);
        }
