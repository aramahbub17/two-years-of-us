<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background">
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
</div>

<div class="lock-screen">

    <!-- Lock -->
    <div class="lock">
        <div class="shackle"></div>

        <div class="lock-body">
            <div class="keyhole"></div>
        </div>
    </div>

    <!-- Number -->
    <div class="pin-area">

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="6"
            autocomplete="off"
        >

    </div>

    <!-- Enter -->
    <button id="enter">ENTER</button>

</div>

<script src="script.js"></script>

</body>
</html>
