<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For you Pakhiii 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
    </div>

    <!-- Main Card -->
    <main class="intro">

        <div class="heart">
            💗
        </div>

        <p class="small-text">A LITTLE SOMETHING FOR YOU</p>

        <h1>
            For you <span>Pakhiii</span>
        </h1>

        <p class="story">
            Two years ago,<br>
            our story began...
        </p>

        <div class="date">
            <span>09</span>
            <i>•</i>
            <span>10</span>
            <i>•</i>
            <span>2024</span>
        </div>

        <button id="enterBtn">
            <span>Unlock Our Story</span>
            <b>→</b>
        </button>

        <p class="bottom-text">
            2 YEARS • 1 STORY • US
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
