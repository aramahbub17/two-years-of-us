<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>For Fariha 💗</title>


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           FULLY FIXED SCREEN
        ========================== */

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            position: fixed;

            inset: 0;

            overscroll-behavior: none;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            color: #642f49;

            background:

                radial-gradient(
                    circle at 50% 30%,
                    #ffffff 0%,
                    #fff5f9 25%,
                    #ffe5ef 55%,
                    #ffc9df 80%,
                    #f3aac9 100%
                );

            touch-action: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }


        /* =========================
           BACKGROUND GLOWS
        ========================== */

        .glow {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(75px);

            z-index: 0;
        }


        .glow.one {

            width: 330px;
            height: 330px;

            top: -130px;
            left: -110px;

            background: #ffffff;

            opacity: .9;
        }


        .glow.two {

            width: 380px;
            height: 380px;

            right: -150px;
            bottom: -150px;

            background: #f58eb9;

            opacity: .38;
        }


        .glow.three {

            width: 220px;
            height: 220px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: #ffffff;

            opacity: .35;

            filter: blur(100px);
        }


        /* =========================
           FLOATING PETALS
        ========================== */

        .petal {

            position: fixed;

            width: 7px;
            height: 11px;

            border-radius:
                100% 0 100% 0;

            background:
                rgba(255,255,255,.75);

            pointer-events: none;

            opacity: 0;

            animation:
                floatingPetal
                linear infinite;
        }


        .petal.one {

            left: 12%;
            top: 10%;

            animation-duration: 7s;
        }


        .petal.two {

            left: 82%;
            top: 5%;

            animation-duration: 9s;

            animation-delay: 2s;
        }


        .petal.three {

            left: 25%;
            top: 35%;

            animation-duration: 8s;

            animation-delay: 1s;
        }


        .petal.four {

            left: 75%;
            top: 45%;

            animation-duration: 10s;

            animation-delay: 3s;
        }


        @keyframes floatingPetal {

            0% {

                transform:
                    translateY(-30px)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: .7;
            }

            50% {

                transform:
                    translateY(45vh)
                    translateX(25px)
                    rotate(180deg);

                opacity: .45;
            }

            100% {

                transform:
                    translateY(110vh)
                    translateX(-20px)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           LOCK SCREEN
        ========================== */

        .lock-screen {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100dvh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding:
                20px;

            overflow: hidden;

            z-index: 10;
        }


        /* =========================
           LOCK
        ========================== */

        .lock {

            position: relative;

            width: 82px;
            height: 98px;

            margin-bottom: 24px;

            filter:
                drop-shadow(
                    0 10px 22px
                    rgba(175,65,110,.22)
                );

            animation:
                lockFloat
                3s
                ease-in-out
                infinite;
        }


        .shackle {

            position: absolute;

            width: 44px;
            height: 49px;

            left: 19px;
            top: 0;

            border:
                5px solid
                #d27c9f;

            border-bottom: none;

            border-radius:
                25px 25px 0 0;
        }


        .lock-body {

            position: absolute;

            width: 70px;
            height: 57px;

            left: 6px;
            bottom: 0;

            border-radius: 13px;

            background:

                linear-gradient(
                    145deg,
                    #ffffff,
                    #f7cada
                );

            border:
                1px solid
                rgba(180,85,125,.25);

            box-shadow:

                0 12px 30px
                rgba(180,70,120,.18),

                inset
                0 1px 1px
                rgba(255,255,255,.9);
        }


        .keyhole {

            position: absolute;

            width: 9px;
            height: 18px;

            left: 30px;
            top: 22px;

            background: #9b5273;

            border-radius: 8px;
        }


        .keyhole::before {

            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            left: -2.5px;
            top: -5px;

            border-radius: 50%;

            background: #9b5273;
        }


        @keyframes lockFloat {

            0%,100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-7px);
            }
        }


        /* =========================
           HINT
        ========================== */

        .hint {

            font-size: 9px;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                rgba(100,45,70,.48);

            margin-bottom: 16px;
        }


        /* =========================
           PIN DOTS
        ========================== */

        .dots {

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 13px;

            height: 20px;

            margin-bottom: 23px;
        }


        .dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.7);

            border:
                1px solid
                #d68aaa;

            transition:
                .25s ease;
        }


        .dot.active {

            background:
                #d65b90;

            border-color:
                #d65b90;

            box-shadow:
                0 0 13px
                rgba(214,91,144,.6);

            transform:
                scale(1.18);
        }


        /* =========================
           KEYPAD
        ========================== */

        .keypad {

            width: min(280px, 85vw);

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;
        }


        .key {

            height: 55px;

            border-radius: 17px;

            border:
                1px solid
                rgba(170,80,120,.16);

            background:
                rgba(255,255,255,.62);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            color: #6d304e;

            font-size: 17px;

            cursor: pointer;

            box-shadow:

                0 7px 20px
                rgba(170,70,110,.08);

            transition:
                transform .15s ease,
                background .2s ease,
                box-shadow .2s ease;
        }


        .key:hover {

            background:
                rgba(255,255,255,.9);

            box-shadow:

                0 10px 25px
                rgba(170,70,110,.13);
        }


        .key:active {

            transform:
                scale(.91);
        }


        /* ENTER */

        .key.enter {

            border: none;

            color: white;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 2px;

            background:

                linear-gradient(
                    135deg,
                    #e48bad,
                    #c75a87
                );

            box-shadow:

                0 8px 22px
                rgba(195,75,125,.25);
        }


        /* DELETE */

        .key.delete {

            font-size: 20px;

            color: #a65578;

            background:
                rgba(255,255,255,.5);
        }


        /* =========================
           BOTTOM TEXT
        ========================== */

        .private {

            margin-top: 18px;

            font-size: 8px;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            color:
                rgba(100,45,70,.35);
        }


        /* =========================
           WRONG PIN SHAKE
        ========================== */

        .shake {

            animation:
                shake
                .35s
                ease;
        }


        @keyframes shake {

            0%,100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-8px);
            }

            75% {
                transform:
                    translateX(8px);
            }
        }


        /* =========================
           SMALL HEIGHT DEVICES
        ========================== */

        @media(max-height: 680px) {

            .lock {

                transform:
                    scale(.78);

                margin-bottom: 8px;
            }

            .hint {

                margin-bottom: 9px;
            }

            .dots {

                margin-bottom: 13px;
            }

            .keypad {

                gap: 7px;
            }

            .key {

                height: 45px;

                border-radius: 14px;
            }

            .private {

                margin-top: 10px;
            }
        }


        /* =========================
           VERY SMALL MOBILE
        ========================== */

        @media(max-width: 350px) {

            .keypad {

                width: 250px;
            }

            .key {

                height: 50px;
            }

            .dots {

                gap: 11px;
            }
        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="glow three"></div>


    <!-- Floating petals -->

    <div class="petal one"></div>

    <div class="petal two"></div>

    <div class="petal three"></div>

    <div class="petal four"></div>


    <!-- LOCK SCREEN -->

    <main
        class="lock-screen"
        id="lockScreen"
    >


        <!-- Lock -->

        <div class="lock">

            <div class="shackle"></div>

            <div class="lock-body">

                <div class="keyhole"></div>

            </div>

        </div>


        <!-- Hint -->

        <div class="hint">
            A little secret
        </div>


        <!-- PIN -->

        <div class="dots">

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>


        <!-- KEYPAD -->

        <div class="keypad">


            <button
                class="key"
                onclick="press(1)"
            >
                1
            </button>


            <button
                class="key"
                onclick="press(2)"
            >
                2
            </button>


            <button
                class="key"
                onclick="press(3)"
            >
                3
            </button>


            <button
                class="key"
                onclick="press(4)"
            >
                4
            </button>


            <button
                class="key"
                onclick="press(5)"
            >
                5
            </button>


            <button
                class="key"
                onclick="press(6)"
            >
                6
            </button>


            <button
                class="key"
                onclick="press(7)"
            >
                7
            </button>


            <button
                class="key"
                onclick="press(8)"
            >
                8
            </button>


            <button
                class="key"
                onclick="press(9)"
            >
                9
            </button>


            <button
                class="key delete"
                onclick="deleteLast()"
            >
                ⌫
            </button>


            <button
                class="key"
                onclick="press(0)"
            >
                0
            </button>


            <button
                class="key enter"
                onclick="checkPIN()"
            >
                ENTER
            </button>


        </div>


        <div class="private">
            made with love ♡
        </div>


    </main>


    <script>

        /* =========================
           PIN SYSTEM
        ========================== */

        const correctPIN =
            "091721";

        let enteredPIN =
            "";


        const dots =
            document.querySelectorAll(".dot");


        const lockScreen =
            document.getElementById("lockScreen");


        /* =========================
           NUMBER PRESS
        ========================== */

        function press(number) {

            if (enteredPIN.length >= 6) {
                return;
            }


            enteredPIN +=
                number;


            updateDots();

        }


        /* =========================
           DELETE
        ========================== */

        function deleteLast() {

            enteredPIN =
                enteredPIN.slice(0, -1);


            updateDots();

        }


        /* =========================
           UPDATE DOTS
        ========================== */

        function updateDots() {

            dots.forEach(
                (dot, index) => {

                    if (
                        index <
                        enteredPIN.length
                    ) {

                        dot.classList.add(
                            "active"
                        );

                    } else {

                        dot.classList.remove(
                            "active"
                        );

                    }

                }
            );

        }


        /* =========================
           CHECK PIN
        ========================== */

        function checkPIN() {


            if (
                enteredPIN ===
                correctPIN
            ) {


                document.body.style.transition =
                    "opacity 1s ease, transform 1s ease";


                document.body.style.opacity =
                    "0";


                document.body.style.transform =
                    "translateY(-30px)";


                setTimeout(() => {

                    window.location.href =
                        "unlocked.html";

                }, 1000);


            } else {


                /* Shake */

                lockScreen.classList.remove(
                    "shake"
                );


                void lockScreen.offsetWidth;


                lockScreen.classList.add(
                    "shake"
                );


                /* Wrong PIN page */

                setTimeout(() => {

                    window.location.href =
                        "error.html";

                }, 400);

            }

        }

    </script>


</body>

</html>
