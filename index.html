<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Fariha 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: #5b2942;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #ffffff 0%,
                    #fff1f7 35%,
                    #ffd9e9 70%,
                    #f7b7d0 100%
                );
        }

        /* Soft glowing background */

        .glow {
            position: fixed;
            width: 300px;
            height: 300px;

            border-radius: 50%;
            filter: blur(70px);

            opacity: .45;

            pointer-events: none;
        }

        .glow.one {
            background: #ffffff;
            top: -100px;
            left: -80px;
        }

        .glow.two {
            background: #ffb4d2;
            right: -100px;
            bottom: -100px;
        }

        /* Main */

        .lock-screen {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 390px;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        /* Lock */

        .lock {
            position: relative;

            width: 82px;
            height: 98px;

            margin-bottom: 30px;

            filter:
                drop-shadow(
                    0 8px 18px rgba(170, 70, 110, .22)
                );

            animation: floatLock 3s ease-in-out infinite;
        }

        .shackle {
            position: absolute;

            width: 43px;
            height: 48px;

            left: 20px;
            top: 0;

            border: 5px solid #d783a6;
            border-bottom: none;

            border-radius: 25px 25px 0 0;
        }

        .lock-body {
            position: absolute;

            width: 70px;
            height: 57px;

            left: 6px;
            bottom: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #fff,
                    #f4c1d7
                );

            border: 1px solid rgba(190,100,140,.25);

            box-shadow:
                0 12px 30px rgba(180,70,120,.2);
        }

        .keyhole {
            position: absolute;

            width: 9px;
            height: 18px;

            left: 30px;
            top: 21px;

            background: #9b5273;

            border-radius: 8px;
        }

        .keyhole::before {
            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            left: -2.5px;
            top: -5px;

            border-radius: 50%;

            background: #9b5273;
        }

        @keyframes floatLock {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* Tiny text */

        .hint {
            font-size: 10px;
            letter-spacing: 4px;

            text-transform: uppercase;

            color: rgba(100,45,70,.55);

            margin-bottom: 20px;
        }

        /* PIN dots */

        .dots {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 13px;

            height: 25px;

            margin-bottom: 30px;
        }

        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            border: 1px solid #d98eae;

            background: rgba(255,255,255,.65);

            transition:
                .25s ease;
        }

        .dot.active {
            background: #d85d91;

            border-color: #d85d91;

            box-shadow:
                0 0 12px rgba(216,93,145,.55);

            transform: scale(1.18);
        }

        /* Keypad */

        .keypad {
            width: 100%;
            max-width: 280px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }

        .key {
            height: 58px;

            border-radius: 18px;

            border:
                1px solid
                rgba(180,90,125,.18);

            background:
                rgba(255,255,255,.55);

            backdrop-filter: blur(12px);

            color: #6d304e;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 6px 18px
                rgba(180,80,120,.08);

            transition:
                .2s ease;
        }

        .key:hover {
            background:
                rgba(255,255,255,.85);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 22px
                rgba(180,80,120,.15);
        }

        .key:active {
            transform:
                scale(.92);
        }

        .key.enter {
            background:
                linear-gradient(
                    135deg,
                    #e78caf,
                    #c95b88
                );

            color: white;

            font-size: 10px;

            letter-spacing: 2px;

            border: none;
        }

        .key.delete {
            font-size: 20px;

            color: #a85878;
        }

        /* Bottom */

        .private {
            margin-top: 24px;

            font-size: 10px;

            letter-spacing: 2px;

            color:
                rgba(100,45,70,.4);
        }

        /* Wrong PIN shake */

        .shake {
            animation:
                shake .35s ease;
        }

        @keyframes shake {

            0%,100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        @media(max-height:700px) {

            .lock {
                transform: scale(.85);
                margin-bottom: 15px;
            }

            .hint {
                margin-bottom: 12px;
            }

            .dots {
                margin-bottom: 18px;
            }

            .key {
                height: 50px;
            }

            .private {
                margin-top: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="lock-screen" id="lockScreen">

        <div class="lock">

            <div class="shackle"></div>

            <div class="lock-body">
                <div class="keyhole"></div>
            </div>

        </div>

        <div class="hint">
            A little secret
        </div>

        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <div class="keypad">

            <button class="key" onclick="press(1)">1</button>
            <button class="key" onclick="press(2)">2</button>
            <button class="key" onclick="press(3)">3</button>

            <button class="key" onclick="press(4)">4</button>
            <button class="key" onclick="press(5)">5</button>
            <button class="key" onclick="press(6)">6</button>

            <button class="key" onclick="press(7)">7</button>
            <button class="key" onclick="press(8)">8</button>
            <button class="key" onclick="press(9)">9</button>

            <button class="key delete" onclick="deleteLast()">⌫</button>
            <button class="key" onclick="press(0)">0</button>
            <button class="key enter" onclick="checkPIN()">ENTER</button>

        </div>

        <div class="private">
            made with love ♡
        </div>

    </main>

    <script>

        const correctPIN = "091721";

        let enteredPIN = "";

        const dots =
            document.querySelectorAll(".dot");

        const lockScreen =
            document.getElementById("lockScreen");


        function press(number) {

            if (enteredPIN.length >= 6) {
                return;
            }

            enteredPIN += number;

            updateDots();

        }


        function deleteLast() {

            enteredPIN =
                enteredPIN.slice(0, -1);

            updateDots();

        }


        function updateDots() {

            dots.forEach((dot, index) => {

                if (index < enteredPIN.length) {

                    dot.classList.add("active");

                } else {

                    dot.classList.remove("active");

                }

            });

        }


        function checkPIN() {

            if (enteredPIN === correctPIN) {

                document.body.style.transition =
                    "opacity 1s ease, transform 1s ease";

                document.body.style.opacity = "0";

                document.body.style.transform =
                    "translateY(-30px)";

                setTimeout(() => {

                    window.location.href =
                        "unlocked.html";

                }, 1000);

            } else {
