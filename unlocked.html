<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>For You 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            inset: 0;
        }

        body {
            font-family: "Times New Roman", Times, serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #f8edf8 0%,
                    #eadcf2 38%,
                    #d8c6e8 70%,
                    #c7b1dc 100%
                );

            color: #493452;
        }

        /* Soft background glow */

        body::before {
            content: "";
            position: fixed;
            width: 420px;
            height: 420px;

            left: 50%;
            top: 45%;

            transform: translate(-50%, -50%);

            background: rgba(255, 255, 255, .45);

            filter: blur(90px);

            border-radius: 50%;

            pointer-events: none;
        }

        /* Main page */

        .page {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            position: relative;

            animation: pageIn 1s ease forwards;
        }

        /* Main glass box */

        .card {
            width: min(92vw, 520px);

            min-height: 570px;

            padding: 35px 28px 32px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            background: rgba(255, 255, 255, .62);

            border: 1px solid rgba(255, 255, 255, .85);

            border-radius: 35px;

            box-shadow:
                0 25px 70px rgba(92, 60, 110, .18),
                inset 0 1px 0 rgba(255,255,255,.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            position: relative;
        }

        .card::before {
            content: "♡";

            position: absolute;

            top: 18px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 25px;

            color: #a97fba;

            opacity: .8;
        }

        /* Sticker */

        .sticker {
            width: min(290px, 68vw);
            height: auto;

            object-fit: contain;

            margin-bottom: 8px;

            animation:
                stickerIn 1.1s cubic-bezier(.2,.8,.2,1) forwards,
                floatSticker 4s ease-in-out 1.2s infinite;

            filter:
                drop-shadow(0 12px 18px rgba(91, 56, 105, .16));
        }

        /* Main text */

        .title {
            font-family: "Times New Roman", Times, serif;

            font-size: clamp(29px, 7vw, 43px);

            line-height: 1.08;

            font-weight: 600;

            letter-spacing: .2px;

            color: #5b3b68;

            margin-top: 2px;

            animation: fadeUp 1s ease .25s both;
        }

        .subtitle {
            font-family: "Times New Roman", Times, serif;

            font-size: clamp(19px, 4.8vw, 25px);

            color: #876597;

            margin-top: 22px;

            letter-spacing: .5px;

            animation: fadeUp 1s ease .45s both;
        }

        /* Divider */

        .divider {
            width: 150px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-top: 22px;

            color: #b184c3;

            animation: fadeUp 1s ease .55s both;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;
            flex: 1;

            background: #c4a2d0;
        }

        .divider span {
            font-size: 18px;
        }

        /* Buttons */

        .buttons {
            display: flex;

            gap: 16px;

            width: 100%;

            justify-content: center;

            margin-top: 28px;

            animation: fadeUp 1s ease .65s both;
        }

        .choice {
            width: 150px;
            height: 55px;

            border-radius: 30px;

            border: 1px solid rgba(139, 103, 154, .35);

            font-family: "Times New Roman", Times, serif;

            font-size: 21px;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .yes {
            background: #cfa6dc;

            color: white;

            box-shadow:
                0 8px 22px rgba(126, 79, 145, .22);
        }

        .no {
            background: rgba(255,255,255,.75);

            color: #765080;

            box-shadow:
                0 8px 22px rgba(126, 79, 145, .10);
        }

        .choice:hover {
            transform: translateY(-3px);
        }

        .choice:active {
            transform: scale(.95);
        }

        .yes:hover {
            background: #c397d2;

            box-shadow:
                0 12px 28px rgba(126, 79, 145, .28);
        }

        .no:hover {
            background: #fff;

            box-shadow:
                0 12px 28px rgba(126, 79, 145, .18);
        }

        /* Small bottom decoration */

        .tiny-heart {
            margin-top: 25px;

            font-size: 16px;

            color: #b184c3;

            opacity: .75;

            animation: fadeUp 1s ease .8s both;
        }

        /* Animations */

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes stickerIn {
            from {
                opacity: 0;
                transform: scale(.55) translateY(25px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatSticker {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .page {
                padding: 14px;
            }

            .card {
                width: 94vw;

                min-height: 560px;

                padding: 28px 20px 25px;

                border-radius: 30px;
            }

            .sticker {
                width: min(265px, 68vw);

                margin-bottom: 5px;
            }

            .title {
                font-size: clamp(27px, 7.5vw, 36px);
            }

            .subtitle {
                font-size: 20px;

                margin-top: 18px;
            }

            .buttons {
                gap: 11px;

                margin-top: 25px;
            }

            .choice {
                width: 135px;
                height: 52px;

                font-size: 20px;
            }
        }

        @media (max-height: 700px) {

            .card {
                min-height: 500px;

                padding-top: 20px;
                padding-bottom: 20px;
            }

            .sticker {
                width: 210px;
            }

            .subtitle {
                margin-top: 13px;
            }

            .divider {
                margin-top: 14px;
            }

            .buttons {
                margin-top: 18px;
            }

            .tiny-heart {
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <!-- Sticker ABOVE the main writing -->
            <img
                class="sticker"
                src="surprise-cats.png"
                alt="Cute cats"
            >

            <h1 class="title">
                I have a little<br>
                surprise for you.
            </h1>

            <div class="divider">
                <span>♡</span>
            </div>

            <p class="subtitle">
                Wanna see it?
            </p>

            <div class="buttons">

                <button class="choice yes" onclick="sayYes()">
                    ♡ YES ♡
                </button>

                <button class="choice no" onclick="sayNo()">
                    ♡ NO ♡
                </button>

            </div>

            <div class="tiny-heart">
                ♡
            </div>

        </section>

    </main>


    <script>

        function sayYes() {

            document.body.style.transition =
                "opacity .8s ease, transform .8s ease";

            document.body.style.opacity = "0";
            document.body.style.transform =
                "translateY(-35px)";

            setTimeout(() => {

                window.location.href =
                    "anniversary.html";

            }, 800);
        }


        function sayNo() {

            document.body.style.transition =
                "opacity .6s ease, transform .6s ease";

            document.body.style.opacity = "0";
            document.body.style.transform =
                "translateX(-25px)";

            setTimeout(() => {

                window.location.href =
                    "no.html";

            }, 600);
        }

    </script>

</body>
</html>
