<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(
                    circle at center,
                    #321426 0%,
                    #12070e 55%,
                    #050306 100%
                );

            color: white;
            font-family: Georgia, serif;
        }

        .page {
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;

            animation: pageIn 1.2s ease forwards;
        }

        .content {
            text-align: center;
            transform: translateY(-15px);
        }

        .small-text {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: rgba(255, 220, 235, .65);

            margin-bottom: 25px;

            animation: fadeUp 1.4s ease forwards;
        }

        .heart {
            font-size: 75px;

            filter:
                drop-shadow(
                    0 0 25px rgba(255, 90, 160, .45)
                );

            animation:
                heartAppear 1.5s ease forwards,
                heartbeat 2s ease-in-out 1.5s infinite;
        }

        /* Arrow */

        .arrow {
            position: absolute;

            left: 30px;
            bottom: 30px;

            width: 55px;
            height: 55px;

            border: 1px solid rgba(255, 200, 220, .35);
            border-radius: 50%;

            background: rgba(255,255,255,.04);

            color: #f8d9e7;

            font-size: 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: .4s ease;

            animation: arrowAppear 2s ease forwards;
        }

        .arrow:hover {
            transform: translateX(5px);

            border-color: rgba(255, 190, 220, .8);

            box-shadow:
                0 0 25px rgba(230, 80, 150, .25);
        }

        @keyframes pageIn {

            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartAppear {

            from {
                opacity: 0;
                transform: scale(.3);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes heartbeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @keyframes arrowAppear {

            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media(max-width:600px) {

            .small-text {
                font-size: 11px;
                letter-spacing: 3px;
            }

            .heart {
                font-size: 65px;
            }

            .arrow {
                left: 22px;
                bottom: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="content">

            <div class="small-text">
                A little something for you
            </div>

            <div class="heart">
                💗
            </div>

        </div>

        <button class="arrow" onclick="nextPage()">
            →
        </button>

    </div>


    <script>

        function nextPage() {

            document.body.style.transition =
                "opacity .8s ease, transform .8s ease";

            document.body.style.opacity = "0";
            document.body.style.transform = "translateY(-40px)";

            setTimeout(() => {

                window.location.href = "anniversary.html";

            }, 800);

        }

    </script>

</body>
</html>
