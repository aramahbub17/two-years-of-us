<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>A Little Surprise 💗</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Times New Roman", serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(255, 205, 232, 0.85),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(211, 190, 255, 0.75),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #fff8fc,
                    #f3eaff,
                    #ffeaf5
                );

            color: #30233d;
        }

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.55);

            filter: blur(80px);

            top: -170px;
            left: -140px;

            pointer-events: none;
        }

        body::after {
            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            background: rgba(220, 195, 255, 0.45);

            filter: blur(90px);

            bottom: -160px;
            right: -130px;

            pointer-events: none;
        }

        .container {
            width: min(90%, 430px);

            text-align: center;

            position: relative;
            z-index: 2;

            padding: 35px 25px 40px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.48);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 25px 70px rgba(100, 70, 130, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: cardIn 1s ease forwards;
        }

        /* =========================
           PICTURE
        ========================== */

        .sticker-wrap {
            width: 220px;
            height: 170px;

            margin: 0 auto 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(245, 235, 255, 0.85),
                    rgba(255, 230, 244, 0.85)
                );

            box-shadow:
                0 15px 40px rgba(120, 85, 150, 0.16),
                inset 0 0 0 1px rgba(255, 255, 255, 0.9);

            overflow: hidden;

            animation: stickerIn 1s ease 0.25s both;
        }

        .sticker {
            width: 100%;
            height: 100%;

            padding: 10px;

            object-fit: contain;

            display: block;
        }

        /* =========================
           MAIN TEXT
        ========================== */

        .main-text {
            font-size: clamp(34px, 8vw, 48px);

            line-height: 1.05;

            font-weight: 400;

            letter-spacing: -0.5px;

            margin-bottom: 18px;

            animation: textIn 1s ease 0.45s both;
        }

        .main-text span {
            display: block;
        }

        /* =========================
           SUBTITLE
        ========================== */

        .subtitle {
            font-family: Arial, sans-serif;

            font-size: 15px;

            letter-spacing: 2px;

            color: #80698f;

            margin-bottom: 28px;

            animation: textIn 1s ease 0.6s both;
        }

        /* =========================
           BUTTONS
        ========================== */

        .buttons {
            display: flex;

            justify-content: center;

            gap: 14px;

            animation: textIn 1s ease 0.75s both;
        }

        button {
            border: none;

            outline: none;

            min-width: 115px;

            padding: 13px 25px;

            border-radius: 999px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .yes {
            background:
                linear-gradient(
                    135deg,
                    #d9b8ff,
                    #f2a8d2
                );

            color: white;

            box-shadow:
                0 10px 25px rgba(190, 130, 210, 0.3);
        }

        .no {
            background: rgba(255, 255, 255, 0.8);

            color: #8b718f;

            border: 1px solid rgba(190, 160, 205, 0.35);

            box-shadow:
                0 8px 20px rgba(130, 100, 150, 0.1);
        }

        button:hover {
            transform: translateY(-3px);
        }

        .yes:hover {
            box-shadow:
                0 14px 30px rgba(190, 130, 210, 0.4);
        }

        .no:hover {
            background: white;
        }

        button:active {
            transform: scale(0.96);
        }

        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes stickerIn {
            from {
                opacity: 0;
                transform: translateY(-15px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes textIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-height: 650px) {

            .container {
                padding: 22px 20px 25px;
            }

            .sticker-wrap {
                width: 175px;
                height: 125px;

                margin-bottom: 18px;
            }

            .main-text {
                font-size: 32px;

                margin-bottom: 12px;
            }

            .subtitle {
                margin-bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Picture -->
        <div class="sticker-wrap">

            <img
                class="sticker"
                src="./surprise-cats.jpg"
                alt="Cute cats"
            >

        </div>


        <!-- Main Message -->
        <div class="main-text">

            <span>I have a little</span>

            <span>surprise for you.</span>

        </div>


        <!-- Subtitle -->
        <div class="subtitle">
            Wanna see it?
        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button
                class="yes"
                onclick="goYes()"
            >
                YES
            </button>

            <button
                class="no"
                onclick="goNo()"
            >
                NO
            </button>

        </div>

    </main>


    <script>

        function goYes() {

            window.location.href = "anniversary.html";

        }


        function goNo() {

            window.location.href = "no.html";

        }

    </script>

</body>
</html>
